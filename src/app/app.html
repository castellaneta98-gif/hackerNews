<div class="container">
  <header class="app-header">
    <h1>Hacker News Dashboard</h1>
    <p class="subtitle">Le ultime notizie dal mondo tech aggiornate in tempo reale</p>
  </header>

  <!-- Griglia delle News con sintassi classica universale -->
  <main class="news-grid">
    <article class="news-card" *ngFor="let news of displayedNews; let i = index">
      <div class="card-counter">#{{ i + 1 }}</div>
      <div class="card-content">
        <h2 class="card-title">{{ news.title }}</h2>
        
        <div class="card-metadata">
          <span class="news-date">
            📅 {{ news.time * 1000 | date:'dd/MM/yyyy - HH:mm' }}
          </span>
        </div>

        <div class="card-actions">
          <a *ngIf="news.url; else noLink" [href]="news.url" target="_blank" class="btn-read">
            Leggi Articolo ↗
          </a>
          <ng-template #noLink>
            <span class="no-link-badge">Discussione Interna (No Link)</span>
          </ng-template>
        </div>
      </div>
    </article>
  </main>

  <!-- Stato di Caricamento -->
  <div class="loader-container" *ngIf="loading">
    <div class="spinner"></div>
    <p>Caricamento notizie in corso...</p>
  </div>

  <!-- Sezione Azioni / Paginazione -->
  <footer class="app-footer" *ngIf="!loading && currentIndex < allIds.length">
    <button class="btn-load-more" (click)="loadNextBatch()">
      Carica Altre 10 News
    </button>
  </footer>
</div>
